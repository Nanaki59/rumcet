# Compile chdman (MAME tools) for each platform shipped by RUMCET.
# Run manually, or called by release.yml. Download the artifacts and put each
# binary in resources/bin/<platform>-<arch>/ (folder names match Node's
# process.platform / process.arch).
# Binaries are cached per MAME tag: a release reusing the same tag does not
# rebuild them (GitHub evicts caches unused for 7 days).

name: Build chdman

on:
  workflow_dispatch:
    inputs:
      mame_tag:
        description: "MAME source tag (e.g. mame0288)"
        required: true
        default: "mame0288"
  workflow_call:
    inputs:
      mame_tag:
        description: "MAME source tag (e.g. mame0288)"
        required: true
        type: string

env:
  MAME_TAG: ${{ inputs.mame_tag || 'mame0288' }}

jobs:
  unix:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-22.04,     target: linux-x64 }
          - { runner: ubuntu-22.04-arm, target: linux-arm64 }
          - { runner: macos-15,         target: darwin-arm64 }
          - { runner: macos-15-intel,   target: darwin-x64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Restore cached build
        id: cache
        uses: actions/cache@v5
        with:
          path: out/${{ matrix.target }}
          # Bump the "v" number when the build or packaging steps change
          key: chdman-v2-${{ env.MAME_TAG }}-${{ matrix.target }}

      - name: Install dependencies (Linux)
        if: steps.cache.outputs.cache-hit != 'true' && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 libsdl2-dev libsdl2-ttf-dev libfontconfig1-dev \
            qt6-base-dev qt6-base-dev-tools
          # MAME always adds "-I$(qmake6 -query QT_INSTALL_HEADERS)", even without the
          # Qt debugger: without qmake6 the bare "-I" swallows the next flag (-std=c++20)
          if ! command -v qmake6 >/dev/null; then
            sudo ln -s /usr/lib/qt6/bin/qmake /usr/local/bin/qmake6
          fi
          qmake6 -query QT_INSTALL_HEADERS

      - name: Install dependencies (macOS)
        if: steps.cache.outputs.cache-hit != 'true' && runner.os == 'macOS'
        # MAME uses the sdl3 OSD on macOS; dylibbundler embeds the Homebrew
        # libraries next to chdman (users do not have Homebrew)
        run: brew install sdl2 sdl2_ttf sdl3 sdl3_ttf dylibbundler

      - name: Fetch MAME source
        if: steps.cache.outputs.cache-hit != 'true'
        run: git clone --depth 1 --branch "$MAME_TAG" https://github.com/mamedev/mame.git mame

      - name: Build tools only
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: mame
        # chdman needs neither the Qt debugger (default on Linux) nor audio/MIDI backends
        run: >
          make -j"$(getconf _NPROCESSORS_ONLN)" TOOLS=1 EMULATOR=0 REGENIE=1
          USE_QTDEBUG=0 NO_USE_MIDI=1 NO_USE_PORTAUDIO=1 NO_USE_PULSEAUDIO=1 NO_USE_PIPEWIRE=1

      - name: Package
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          OUT="out/${{ matrix.target }}"
          mkdir -p "$OUT"
          cp mame/chdman "$OUT/chdman"
          strip "$OUT/chdman" || true
          chmod 755 "$OUT/chdman"
          if [ "$RUNNER_OS" = "macOS" ]; then
            # Copy the Homebrew dylibs into lib/ and point chdman at them
            dylibbundler -of -b -cd -x "$OUT/chdman" -d "$OUT/lib" -p @executable_path/lib/
            # Rewriting the load paths invalidates signatures: ad-hoc re-sign everything
            codesign --force -s - "$OUT"/lib/*.dylib
            codesign --force -s - "$OUT/chdman"
          fi

      - name: Smoke test
        run: |
          OUT="out/${{ matrix.target }}"
          # Without arguments chdman prints its usage and exits with code 1
          "$OUT/chdman" > usage.txt 2>&1 || true
          cat usage.txt | head -n 5
          grep -q "CHD" usage.txt
          if [ "$RUNNER_OS" = "Linux" ]; then
            ldd "$OUT/chdman"
          else
            otool -L "$OUT/chdman" "$OUT"/lib/*.dylib
            # Nothing may still point to Homebrew (absent on users' Macs)
            if otool -L "$OUT/chdman" "$OUT"/lib/*.dylib | grep -E '/opt/homebrew|/usr/local/(opt|Cellar)'; then
              echo "chdman still depends on Homebrew libraries"; exit 1
            fi
          fi

      - uses: actions/upload-artifact@v6
        with:
          name: chdman-${{ matrix.target }}
          path: out/

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Restore cached build
        id: cache
        uses: actions/cache@v5
        with:
          path: out/win32-x64
          key: chdman-${{ env.MAME_TAG }}-win32-x64

      - uses: msys2/setup-msys2@v2
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          msystem: MINGW64
          # MINGW64 is the environment documented by MAME; keep it while it works
          suppress-deprecation-warnings: msystem-mingw64
          update: true
          install: >-
            git make
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-python
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-SDL2_ttf

      - name: Fetch MAME source
        if: steps.cache.outputs.cache-hit != 'true'
        run: git clone --depth 1 --branch "$MAME_TAG" https://github.com/mamedev/mame.git mame

      - name: Build tools only
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: mame
        run: make -j"$(nproc)" TOOLS=1 EMULATOR=0 REGENIE=1 MINGW64=/mingw64

      - name: Package
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p out/win32-x64
          cp mame/chdman.exe out/win32-x64/chdman.exe
          strip out/win32-x64/chdman.exe || true

      - name: Smoke test (outside MSYS2, to catch missing DLLs)
        shell: pwsh
        run: |
          # Without arguments chdman prints its usage and exits with code 1
          $usage = & .\out\win32-x64\chdman.exe 2>&1 | Out-String
          $usage.Split("`n")[0]
          if ($LASTEXITCODE -ne 0 -and $LASTEXITCODE -ne 1) { exit 1 }
          if ($usage -notmatch 'CHD') { exit 1 }
          exit 0

      - uses: actions/upload-artifact@v6
        with:
          name: chdman-win32-x64
          path: out/
